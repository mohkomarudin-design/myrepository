<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pra-Audit System — PT Pertamina International Shipping</title>
  <!-- Google Fonts: Plus Jakarta Sans for premium typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js for beautiful animated dashboard statistics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- html2canvas for matrix JPG export feature -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0066cc', // Pertamina Blue
              600: '#0052a3',
              700: '#003d7a',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Styling scrollbar premium */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Glassmorphism utility */
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen antialiased">

  <!-- ================= TOAST NOTIFICATION ================= -->
  <div id="toast-box" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-3 bg-slate-900/95 backdrop-blur text-white px-5 py-4 rounded-2xl shadow-2xl border border-slate-800">
    <div id="toast-icon"></div>
    <span id="toast-message" class="text-sm font-semibold tracking-wide"></span>
    <button onclick="hideToast()" class="text-slate-400 hover:text-white ml-2 transition">
      <i data-lucide="x" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- ================= LAYAR UTAMA APLIKASI ================= -->
  <div id="app" class="h-screen overflow-hidden">
    <!-- Konten diisi oleh JavaScript berdasarkan status Login -->
    <div class="h-full flex items-center justify-center bg-slate-100">
      <div class="flex flex-col items-center">
        <div class="w-12 h-12 border-4 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 text-sm font-medium text-slate-500">Memuat Aplikasi Pra-Audit...</p>
      </div>
    </div>
  </div>

  <!-- ================= TEMPLATE & MANAJEMEN STATE DI JAVASCRIPT ================= -->
  <script>
    // Konfigurasi API
    const API_BASE = 'http://localhost:5000/api';

    // State Global Aplikasi
    let state = {
      currentUser: null,
      activeTab: 'dashboard',
      selectedLocId: null,
      selectedAuditId: null,
      expandedMenu: 'A1',
      selectedYear: 2026,
      audits: [],
      locations: [],
      docs: [],
      records: [],
      users: [],
      searchQuery: '',
      showNotifications: false,
      toastTimer: null
    };

    // Peta Status Dokumen
    const STATUS_MAP = {
      red: {
        badge: `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-50 text-red-700 border border-red-200"><i data-lucide="alert-triangle" class="w-3.5 h-3.5 mr-1 text-red-500"></i> Belum Mengisi</span>`,
        iconColor: 'bg-red-500',
        textColor: 'text-red-700',
        bgColor: 'bg-red-50/50',
        borderColor: 'border-red-100'
      },
      yellow: {
        badge: `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200"><i data-lucide="clock" class="w-3.5 h-3.5 mr-1 text-amber-500"></i> Perlu Perbaikan</span>`,
        iconColor: 'bg-amber-400',
        textColor: 'text-amber-700',
        bgColor: 'bg-amber-50/50',
        borderColor: 'border-amber-100'
      },
      clear: {
        badge: `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200"><i data-lucide="check-circle" class="w-3.5 h-3.5 mr-1 text-emerald-500"></i> Sesuai</span>`,
        iconColor: 'bg-emerald-500',
        textColor: 'text-emerald-700',
        bgColor: 'bg-emerald-50/50',
        borderColor: 'border-emerald-100'
      }
    };

    // Fungsi Pembantu Toast
    function showToast(message, type = 'success') {
      const box = document.getElementById('toast-box');
      const icon = document.getElementById('toast-icon');
      const msg = document.getElementById('toast-message');

      msg.innerText = message;

      let iconHtml = '';
      if (type === 'success') {
        iconHtml = `<i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>`;
      } else if (type === 'warning') {
        iconHtml = `<i data-lucide="alert-triangle" class="w-5 h-5 text-amber-400"></i>`;
      } else if (type === 'info') {
        iconHtml = `<i data-lucide="info" class="w-5 h-5 text-blue-400"></i>`;
      }
      icon.innerHTML = iconHtml;

      box.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
      box.classList.add('translate-y-0', 'opacity-100');

      lucide.createIcons();

      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => {
        hideToast();
      }, 4000);
    }

    function hideToast() {
      const box = document.getElementById('toast-box');
      box.classList.remove('translate-y-0', 'opacity-100');
      box.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
    }

    // Mengambil Data Awal (Initialization)
    async function initData() {
      try {
        const initRes = await fetch(`${API_BASE}/init-data`);
        const initJson = await initRes.json();
        
        state.audits = initJson.audits;
        state.locations = initJson.locations;
        state.docs = initJson.docs;
        state.users = initJson.users;

        const recordsRes = await fetch(`${API_BASE}/records?year=${state.selectedYear}`);
        const recordsJson = await recordsRes.json();
        state.records = recordsJson.records;

        // Cek Link Akses Cepat (Guest Link hash)
        const hash = window.location.hash;
        if (hash.startsWith('#access=')) {
          const [aId, lId] = hash.replace('#access=', '').split('-');
          const numLId = parseInt(lId, 10);
          const targetLoc = state.locations.find(l => l.id === numLId);
          if (targetLoc) {
            state.currentUser = {
              username: `guest_${numLId}`,
              role: 'auditee',
              location_id: numLId,
              name: `Akses Tamu (${targetLoc.name})`
            };
            state.selectedAuditId = aId;
            state.selectedLocId = numLId;
            state.expandedMenu = aId;
            state.activeTab = 'location';
            showToast(`Masuk sebagai tamu entitas ${targetLoc.name}!`, 'success');
          }
          window.location.hash = ''; // Bersihkan hash
        } else {
          // Cari jika ada session user di local (simulasi)
          const savedUser = localStorage.getItem('pra_audit_user');
          if (savedUser) {
            state.currentUser = JSON.parse(savedUser);
            if (state.currentUser.role === 'auditee') {
              state.activeTab = 'location';
              state.selectedAuditId = 'A1';
              state.selectedLocId = state.currentUser.location_id;
              state.expandedMenu = 'A1';
            }
          }
        }
      } catch (err) {
        console.error('Koneksi backend gagal. Memuat data mock lokal...', err);
        showToast('Gagal terhubung ke server. Menggunakan data simulasi.', 'warning');
        loadMockDataFallback();
      }

      renderApp();
    }

    function loadMockDataFallback() {
      // Data fallback jika server mati (agar aplikasi tetap jalan dan indah)
      state.locations = [
        { id: 1, name: 'TJ Priok', pic: 'Panji' },
        { id: 2, name: 'TJ Uban', pic: 'Bima' },
        { id: 3, name: 'Palembang', pic: 'Bima' },
        { id: 4, name: 'Cilacap', pic: 'Panji' },
        { id: 5, name: 'Dumai', pic: 'Bima' },
        { id: 6, name: 'Bali', pic: 'Panji' },
        { id: 7, name: 'VP TE', pic: 'Panji' },
      ];
      state.audits = [
        { id: 'A1', name: 'Audit ISO 17020 QnQ' },
        { id: 'A2', name: 'Audit BPK' },
        { id: 'A3', name: 'Audit Internal (K3)' },
      ];
      state.docs = [
        { id: 'D01', name: 'CV Personil' },
        { id: 'D02', name: 'FP-DSDM01-02 Uraian Jabatan' },
        { id: 'D03', name: 'FP-DSDM31-03 Jadwal Pemantauan Kinerja' },
        { id: 'D04', name: 'FP-DSDM31-04 Form Penilaian Kinerja' },
        { id: 'D05', name: 'FP-MR38-02 Pernyataan Kesediaan Personil' },
        { id: 'D06', name: 'FP-MR40-01 Daftar Peralatan' },
        { id: 'D07', name: 'FP-MR40-02 Daftar Pemantauan Peralatan' },
        { id: 'D08', name: 'FP-MR40-03 Program Kalibrasi Peralatan' },
        { id: 'D09', name: 'FP-MR40-04 Laporan Kerusakan Alat' },
        { id: 'D10', name: 'FP-MR40-05 Log Book Penggunaan Alat' },
        { id: 'D11', name: 'Sertifikat Kalibrasi' },
      ];
      state.users = [
        { username: 'admin', password: '123', role: 'auditor', name: 'Super Auditor' },
        { username: 'priok', password: '123', role: 'auditee', location_id: 1, name: 'Admin TJ Priok' },
        { username: 'uban', password: '123', role: 'auditee', location_id: 2, name: 'Admin TJ Uban' },
      ];
      // Generate records fallback
      state.records = [];
    }

    // ================= SINKRONISASI RENDERING DENGAN STATE UTAMA =================
    function renderApp() {
      const container = document.getElementById('app');

      if (!state.currentUser) {
        container.innerHTML = getLoginScreenHtml();
        initLoginListeners();
      } else {
        container.innerHTML = getMainLayoutHtml();
        initSidebarListeners();
        renderTabContent();
      }

      lucide.createIcons();
    }

    // LAYAR LOGIN
    function getLoginScreenHtml() {
      return `
        <div class="min-h-screen bg-slate-100 flex flex-col justify-center py-12 sm:px-6 lg:px-8 font-sans">
          <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <div class="flex justify-center mb-6">
              <div class="w-16 h-16 rounded-2xl bg-brand-500 flex items-center justify-center font-bold text-white text-2xl shadow-xl shadow-brand-500/20">PA</div>
            </div>
            <h2 class="text-center text-3xl font-extrabold text-slate-900 tracking-tight">Pra-Audit System</h2>
            <p class="mt-2 text-center text-sm text-slate-600 font-medium">PT Pertamina International Shipping</p>
          </div>

          <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
            <div class="bg-white py-8 px-4 shadow-xl sm:rounded-2xl sm:px-10 border border-slate-200 glass-card">
              <form id="login-form" class="space-y-6">
                <div>
                  <label class="block text-sm font-semibold text-slate-700">Username</label>
                  <div class="mt-1.5 relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                      <i data-lucide="user" class="h-5 w-5"></i>
                    </div>
                    <input id="username" type="text" required class="appearance-none block w-full pl-10 px-3 py-2.5 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-sm font-medium transition" placeholder="Masukkan username..." />
                  </div>
                </div>

                <div>
                  <label class="block text-sm font-semibold text-slate-700">Password</label>
                  <div class="mt-1.5 relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                      <i data-lucide="lock" class="h-5 w-5"></i>
                    </div>
                    <input id="password" type="password" required class="appearance-none block w-full pl-10 px-3 py-2.5 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-sm transition" placeholder="••••••••" />
                  </div>
                </div>

                <div id="login-error" class="hidden text-red-600 text-sm bg-red-50 p-3 rounded-xl flex items-center border border-red-100 font-medium">
                  <i data-lucide="alert-triangle" class="w-4 h-4 mr-2 text-red-500"></i> <span id="error-text"></span>
                </div>

                <div>
                  <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-xl shadow-md text-sm font-semibold text-white bg-brand-500 hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition shadow-brand-500/10">
                    Masuk Ke Akun
                  </button>
                </div>
              </form>

              <div class="mt-6">
                <div class="relative">
                  <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200" /></div>
                  <div class="relative flex justify-center text-xs font-semibold uppercase"><span class="px-3 bg-white text-slate-500 tracking-wider">Demo Cepat</span></div>
                </div>
                <div class="mt-6 grid grid-cols-2 gap-3">
                  <button onclick="fillDemo('admin')" type="button" class="w-full inline-flex justify-center py-2 px-4 border border-slate-200 rounded-xl bg-slate-50 text-xs font-bold text-slate-700 hover:bg-slate-100 transition">Auditor Pusat</button>
                  <button onclick="fillDemo('priok')" type="button" class="w-full inline-flex justify-center py-2 px-4 border border-slate-200 rounded-xl bg-slate-50 text-xs font-bold text-slate-700 hover:bg-slate-100 transition">Auditee Cabang</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function initLoginListeners() {
      const form = document.getElementById('login-form');
      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const usernameInput = document.getElementById('username').value;
        const passwordInput = document.getElementById('password').value;
        const errorDiv = document.getElementById('login-error');
        const errorText = document.getElementById('error-text');

        try {
          const res = await fetch(`${API_BASE}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: usernameInput, password: passwordInput })
          });
          const data = await res.json();

          if (data.success) {
            state.currentUser = data.user;
            localStorage.setItem('pra_audit_user', JSON.stringify(data.user));

            if (data.user.role === 'auditee') {
              state.activeTab = 'location';
              state.selectedAuditId = 'A1';
              state.selectedLocId = data.user.location_id;
              state.expandedMenu = 'A1';
            } else {
              state.activeTab = 'dashboard';
            }

            showToast(`Selamat datang, ${data.user.name}!`, 'success');
            renderApp();
          } else {
            errorText.innerText = data.message || 'Username atau password salah!';
            errorDiv.classList.remove('hidden');
            lucide.createIcons();
          }
        } catch (err) {
          console.error(err);
          // Fallback login statis jika server mati (demo/offline)
          const fallbackUser = state.users.find(u => u.username === usernameInput && u.password === passwordInput);
          if (fallbackUser) {
            state.currentUser = fallbackUser;
            localStorage.setItem('pra_audit_user', JSON.stringify(fallbackUser));
            if (fallbackUser.role === 'auditee') {
              state.activeTab = 'location';
              state.selectedAuditId = 'A1';
              state.selectedLocId = fallbackUser.location_id;
              state.expandedMenu = 'A1';
            } else {
              state.activeTab = 'dashboard';
            }
            showToast(`Offline mode: Login sebagai ${fallbackUser.name}`, 'info');
            renderApp();
          } else {
            errorText.innerText = 'Gagal menghubungi server backend.';
            errorDiv.classList.remove('hidden');
            lucide.createIcons();
          }
        }
      });
    }

    function fillDemo(type) {
      document.getElementById('username').value = type;
      document.getElementById('password').value = '123';
      document.getElementById('login-form').dispatchEvent(new Event('submit'));
    }

    function logout() {
      state.currentUser = null;
      localStorage.removeItem('pra_audit_user');
      showToast('Anda berhasil keluar dari sistem.', 'info');
      renderApp();
    }

    // STRUKTUR UTAMA DASHBOARD
    function getMainLayoutHtml() {
      const isAuditor = state.currentUser.role === 'auditor';
      
      let sidebarNavHtml = '';
      if (isAuditor) {
        sidebarNavHtml += `
          <button onclick="switchTab('dashboard')" class="w-full flex items-center px-4 py-3 rounded-xl text-sm font-semibold transition ${state.activeTab === 'dashboard' ? 'bg-brand-500/15 text-brand-400 font-bold' : 'hover:bg-slate-800 hover:text-white text-slate-400'}">
            <i data-lucide="home" class="w-5 h-5 mr-3"></i> Dashboard
          </button>
        `;
      }
      
      sidebarNavHtml += `
        <button onclick="switchTab('report')" class="w-full flex items-center px-4 py-3 rounded-xl text-sm font-semibold transition ${state.activeTab === 'report' ? 'bg-brand-500/15 text-brand-400 font-bold' : 'hover:bg-slate-800 hover:text-white text-slate-400'}">
          <i data-lucide="bar-chart-2" class="w-5 h-5 mr-3"></i> Matrix Hasil
        </button>
      `;

      // Render Program List (Sidebar)
      let auditsListHtml = '';
      state.audits.forEach(audit => {
        const totalRevisions = state.records.filter(r => r.audit_id === audit.id && r.year === state.selectedYear && r.status === 'yellow').length;
        const isExpanded = state.expandedMenu === audit.id;

        let branchesListHtml = '';
        const visibleLocs = isAuditor ? state.locations : state.locations.filter(l => l.id === state.currentUser.location_id);

        visibleLocs.forEach(loc => {
          const isSelected = state.activeTab === 'location' && state.selectedAuditId === audit.id && state.selectedLocId === loc.id;
          const locRevisions = state.records.filter(r => r.location_id === loc.id && r.audit_id === audit.id && r.year === state.selectedYear && r.status === 'yellow').length;

          branchesListHtml += `
            <div onclick="selectLocation('${audit.id}', ${loc.id})" class="group flex items-center justify-between pl-10 pr-3 py-2.5 rounded-xl text-sm cursor-pointer transition ${isSelected ? 'bg-slate-800 text-white font-bold' : 'text-slate-400 hover:bg-slate-800/40 hover:text-white'}">
              <div class="flex items-center overflow-hidden mr-2">
                <div class="w-1.5 h-1.5 rounded-full mr-3 shrink-0 ${isSelected ? 'bg-brand-500' : 'bg-slate-600'}"></div>
                <span class="truncate">${loc.name}</span>
              </div>
              <div class="flex items-center gap-1 shrink-0">
                ${locRevisions > 0 ? `<span class="bg-amber-500/20 text-amber-500 text-[10px] font-bold px-1.5 py-0.5 rounded-lg border border-amber-500/30">${locRevisions}</span>` : ''}
                
                ${isAuditor ? `
                  <div class="hidden group-hover:flex items-center gap-0.5 bg-slate-900 border border-slate-700/60 p-0.5 rounded-lg shadow-lg">
                    <button onclick="event.stopPropagation(); triggerShareLink('${audit.id}', ${loc.id})" class="p-1 text-slate-400 hover:text-indigo-400 hover:bg-slate-800 rounded transition" title="Salin Link Akses Tamu"><i data-lucide="link" class="w-3.5 h-3.5"></i></button>
                    <button onclick="event.stopPropagation(); openEditLocationModal(${loc.id})" class="p-1 text-slate-400 hover:text-blue-400 hover:bg-slate-800 rounded transition" title="Edit Cabang"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>
                    <button onclick="event.stopPropagation(); triggerCopyLocation(${loc.id})" class="p-1 text-slate-400 hover:text-green-400 hover:bg-slate-800 rounded transition" title="Salin Cabang"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
                    <button onclick="event.stopPropagation(); openDeleteLocationModal(${loc.id})" class="p-1 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded transition" title="Hapus Cabang"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                  </div>
                ` : ''}
              </div>
            </div>
          `;
        });

        auditsListHtml += `
          <div class="mb-1.5">
            <div onclick="toggleSidebarMenu('${audit.id}')" class="group relative flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-semibold cursor-pointer transition ${isExpanded ? 'bg-slate-800 text-white' : 'hover:bg-slate-800 hover:text-white text-slate-400'}">
              <div class="flex items-center min-w-0 flex-1">
                <i data-lucide="folder" class="w-4 h-4 mr-3 shrink-0 ${isExpanded ? 'text-brand-400' : 'text-slate-500'}"></i>
                <span class="truncate pr-1.5 text-left">${audit.name}</span>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                ${totalRevisions > 0 && !isExpanded ? `<div class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse shadow-[0_0_8px_rgba(245,158,11,0.6)]"></div>` : ''}
                
                ${isAuditor ? `
                  <div class="hidden group-hover:flex items-center gap-1 bg-slate-900 border border-slate-700/60 p-0.5 rounded-lg shadow-lg">
                    <button onclick="event.stopPropagation(); triggerDownloadAllFiles('${audit.id}')" class="p-1 text-slate-400 hover:text-green-400 hover:bg-slate-800 rounded transition" title="Download Semua Berkas"><i data-lucide="download" class="w-3.5 h-3.5"></i></button>
                    <button onclick="event.stopPropagation(); openDeleteAuditModal('${audit.id}')" class="p-1 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded transition" title="Hapus Audit"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                  </div>
                ` : ''}
                <i data-lucide="chevron-right" class="w-4 h-4 transition-transform duration-200 ${isExpanded ? 'rotate-90 text-brand-400' : 'text-slate-500'}"></i>
              </div>
            </div>
            
            <div class="overflow-hidden transition-all duration-300 ${isExpanded ? 'max-h-[800px] opacity-100 mt-1' : 'max-h-0 opacity-0'}">
              ${branchesListHtml}
              ${isAuditor ? `

    // ================= CONTROLLER SISTEM NOTIFIKASI =================
    function getPendingNotifications() {
      let list = state.records.filter(r => r.year === state.selectedYear && r.status === 'yellow');
      if (state.currentUser.role === 'auditee') {
        list = list.filter(r => r.location_id === state.currentUser.location_id);
      }
      return list.map(r => {
        const audit = state.audits.find(a => a.id === r.audit_id);
        const loc = state.locations.find(l => l.id === r.location_id);
        const doc = state.docs.find(d => d.id === r.document_id);
        return {
          ...r,
          auditName: audit?.name || 'Audit',
          locName: loc?.name || 'Lokasi',
          docName: doc?.name || 'Dokumen'
        };
      });
    }

    function toggleNotifications() {
      const box = document.getElementById('notifications-box');
      if (!box) return;
      box.classList.toggle('hidden');
    }

    function getNotificationsHtml() {
      const list = getPendingNotifications();
      if (list.length === 0) {
        return `<div class="p-6 text-center text-xs text-slate-400 italic">Tidak ada notifikasi baru saat ini.</div>`;
      }
      return list.map(notif => `
        <div onclick="selectLocation('${notif.audit_id}', ${notif.location_id}); toggleNotifications();" class="p-3.5 border-b border-slate-100 hover:bg-slate-50 cursor-pointer transition">
          <div class="text-[10px] font-bold text-amber-600 mb-1 flex items-center tracking-wider uppercase">

    function updateDashAudit(auditId) {
      localStorage.setItem('dash_audit_id', auditId);
      renderTabContent();
    }

    function calculateStats(auditId) {
      const filteredRecords = state.records.filter(r => r.audit_id === auditId);
      const total = state.docs.length * state.locations.length;
      
      let red = 0;
      let yellow = 0;
      let clear = 0;

      // Iterasikan ke semua document dan locations secara komprehensif
      state.locations.forEach(loc => {
        state.docs.forEach(doc => {
          const rec = filteredRecords.find(r => r.location_id === loc.id && r.document_id === doc.id);
          if (!rec || rec.status === 'red') red++;
          else if (rec.status === 'yellow') yellow++;
          else if (rec.status === 'clear') clear++;
        });
      });

      // Siapkan data per lokasi untuk Chart.js
      const locStats = state.locations.map(loc => {
        const locRecords = filteredRecords.filter(r => r.location_id === loc.id);
        let lRed = 0, lYellow = 0, lClear = 0;

        state.docs.forEach(doc => {
          const rec = locRecords.find(r => r.document_id === doc.id);
          if (!rec || rec.status === 'red') lRed++;
          else if (rec.status === 'yellow') lYellow++;
          else if (rec.status === 'clear') lClear++;
        });

        return {
          name: loc.name,
          red: lRed,
          yellow: lYellow,
          clear: lClear
        };
      });

      return { total, red, yellow, clear, locStats, filteredRecords };
    }

    let globalChart = null;
    function renderDashboardCharts() {
      const canvas = document.getElementById('cabangChart');
      if (!canvas) return;

      const selectedAuditDash = localStorage.getItem('dash_audit_id') || 'A1';
      const stats = calculateStats(selectedAuditDash);

      const labels = stats.locStats.map(s => s.name);
      const dataRed = stats.locStats.map(s => s.red);
      const dataYellow = stats.locStats.map(s => s.yellow);
      const dataClear = stats.locStats.map(s => s.clear);

      if (globalChart) {
        globalChart.destroy();
      }

      const ctx = canvas.getContext('2d');
      globalChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Belum Mengisi (Merah)',
              data: dataRed,
              backgroundColor: '#ef4444',
              borderRadius: 4
            },
            {
              label: 'Perlu Perbaikan (Kuning)',
              data: dataYellow,
              backgroundColor: '#fbbf24',
              borderRadius: 4
            },
            {
              label: 'Sesuai (Hijau)',
              data: dataClear,
              backgroundColor: '#10b981',
              borderRadius: 4
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { stacked: true, grid: { display: false } },
            y: { stacked: true, grid: { color: '#f1f5f9' }, ticks: { stepSize: 1 } }
          },
          plugins: {
            legend: { position: 'bottom', labels: { boxWidth: 12, font: { family: 'Plus Jakarta Sans', weight: '600' } } }
          }
        }
      });
    }

    // --- VIEW: LOCATION VIEW (TABEL PERSYARATAN DOKUMEN) ---

          audit_id: audit.id,
          location_id: location.id,
          document_id: doc.id,

          status: 'red',
          notes: '',

                  Buka File

                ${isAuditor ? `

                ` : ''}
              </div>
            </td>
          </tr>
        `;
      });

      if (locRecords.length === 0) {
        tbodyHtml = `<tr><td colspan="5" class="p-8 text-center text-slate-400 italic">Tidak ada kebutuhan dokumen yang cocok.</td></tr>`;

      return `
        <div class="p-6">
          <!-- header -->

              <p class="text-sm font-semibold text-slate-500 mt-1">PIC Pemeriksa: ${location.pic} • Tahun Audit: ${state.selectedYear}</p>

      state.docs.forEach((doc, idx) => {
        // Cek apakah ada record pending (Red/Yellow) di kolom terpilih
        let hasPending = false;
        filteredLocs.forEach(loc => {
          const rec = state.records.find(r => r.location_id === loc.id && r.document_id === doc.id && r.audit_id === filterAudit && r.year === state.selectedYear);
          const status = rec?.status || 'red';
          if (status === 'red' || status === 'yellow') {
            hasPending = true;

        if (filterStatus === 'pending' && !hasPending) return;

        let cellsHtml = '';
        filteredLocs.forEach(loc => {
          const rec = state.records.find(r => r.location_id === loc.id && r.document_id === doc.id && r.audit_id === filterAudit && r.year === state.selectedYear);
          const status = rec?.status || 'red';
          const notes = rec?.notes || '';

          let cellClass = "p-3 border-r border-slate-200 text-center align-top ";
          let icon = '';
          let notesBox = '';

          if (status === 'red') {
            cellClass += "bg-red-50/50 text-red-500";
            icon = `<div class="mx-auto w-3 h-3 rounded-full bg-red-500 mb-1.5 mt-1"></div>`;
            notesBox = notes ? `<div class="text-[10px] text-red-700 leading-snug mt-1.5 text-left bg-red-100/50 p-2 rounded-lg border border-red-100 font-semibold">${notes}</div>` : '';
          } else if (status === 'yellow') {
            cellClass += "bg-amber-50/50 text-amber-500";
            icon = `<div class="mx-auto w-3 h-3 rounded-full bg-amber-400 mb-1.5 mt-1"></div>`;
            notesBox = notes ? `<div class="text-[10px] text-amber-700 leading-snug mt-1.5 text-left bg-amber-100/50 p-2 rounded-lg border border-amber-200/80 font-semibold">${notes}</div>` : '';
          } else {
            cellClass += "bg-emerald-50/50 text-emerald-600";
            icon = `<i data-lucide="check-circle" class="w-4 h-4 mx-auto text-emerald-500 mb-1.5 mt-0.5"></i>`;
            notesBox = notes ? `<div class="text-[10px] text-emerald-700 leading-snug mt-1.5 text-left bg-emerald-100/40 p-2 rounded-lg border border-emerald-200/60 font-semibold">${notes}</div>` : '';
          }

          cellsHtml += `
            <td class="${cellClass}">
              <div class="flex flex-col items-center">
                 ${icon}
                 ${notesBox}
              </div>
            </td>
          `;
        });

        rowsHtml += `

                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Pertamina Pra-Audit System</div>
              </div>

              <table class="w-full text-left text-xs border border-slate-200 rounded-xl overflow-hidden min-w-[1000px]">
                <thead class="bg-slate-50/50 border-b border-slate-200 sticky top-0 z-20">
                  <tr>
                    <th class="p-3 border-r border-slate-200 w-10 text-center sticky left-0 bg-slate-100/90 backdrop-blur z-30 font-bold">No</th>

    function updateMatrixFilter(key, val) {
      localStorage.setItem(`matrix_${key}`, val);

    async function exportMatrixJPG() {
      const area = document.getElementById('export-matrix-area');
      if (!area) return;

      showToast('Menyiapkan gambar matriks...', 'info');

      try {
        const canvas = await html2canvas(area, {
          scale: 2,
          backgroundColor: '#ffffff',
          logging: false,
          useCORS: true
        });

        const image = canvas.toDataURL('image/jpeg', 0.95);
        const link = document.createElement('a');
        link.href = image;

        const filterAudit = localStorage.getItem('matrix_audit') || 'A1';
        const auditName = state.audits.find(a => a.id === filterAudit)?.name || 'Audit';

        link.download = `Matriks_${auditName.replace(/\s+/g, '_')}_${state.selectedYear}.jpg`;
        link.click();
        
        showToast('Gambar matriks berhasil diunduh!', 'success');
      } catch (err) {
        console.error(err);
        showToast('Gagal memproses ekspor gambar.', 'warning');
      }
    }

    // Manajemen Viewer Canvas (Drag & Pan + Pencil Drawing)
    function initDocumentCanvasListeners() {
      const viewport = document.getElementById('modal-viewport');
      if (!viewport) return;

      viewport.addEventListener('mousedown', (e) => {
        if (!modalDocState.activeFile) return;
        if (modalDocState.tool === 'hand') {
          modalDocState.isDragging = true;
          modalDocState.lastMouse = { x: e.clientX, y: e.clientY };
          viewport.style.cursor = 'grabbing';
        } else if (modalDocState.tool === 'pencil') {
          const paper = document.getElementById('modal-paper');
          const rect = paper.getBoundingClientRect();
          // Cari kordinat pointer relatif terhadap kertas (paper) berskala zoom
          const docX = (e.clientX - rect.left) / modalDocState.zoom;
          const docY = (e.clientY - rect.top) / modalDocState.zoom;
          modalDocState.currentLine = [{ x: docX, y: docY }];
        }
      });

      viewport.addEventListener('mousemove', (e) => {
        if (!modalDocState.activeFile) return;
        if (modalDocState.tool === 'hand' && modalDocState.isDragging) {
          const dx = e.clientX - modalDocState.lastMouse.x;
          const dy = e.clientY - modalDocState.lastMouse.y;
          
          modalDocState.pan.x += dx;
          modalDocState.pan.y += dy;
          modalDocState.lastMouse = { x: e.clientX, y: e.clientY };
          
          const paper = document.getElementById('modal-paper');
          paper.style.transform = `translate(${modalDocState.pan.x}px, ${modalDocState.pan.y}px) scale(${modalDocState.zoom})`;
        } else if (modalDocState.tool === 'pencil' && modalDocState.currentLine) {
          const paper = document.getElementById('modal-paper');
          const rect = paper.getBoundingClientRect();
          const docX = (e.clientX - rect.left) / modalDocState.zoom;
          const docY = (e.clientY - rect.top) / modalDocState.zoom;
          
          modalDocState.currentLine.push({ x: docX, y: docY });
          drawSvgTempLine();
        }
      });

      window.addEventListener('mouseup', () => {
        if (modalDocState.isDragging) {
          modalDocState.isDragging = false;
          viewport.style.cursor = 'grab';
        }
        if (modalDocState.tool === 'pencil' && modalDocState.currentLine) {
          const fId = modalDocState.activeFile.id;
          if (!modalDocState.drawingLines[fId]) {
            modalDocState.drawingLines[fId] = [];
          }
          modalDocState.drawingLines[fId].push(modalDocState.currentLine);
          modalDocState.currentLine = null;
          redrawModalDrawings();
        }
      });

      viewport.addEventListener('wheel', (e) => {
        if (!modalDocState.activeFile) return;
        if (e.ctrlKey) {
          e.preventDefault();
          const zoomDelta = e.deltaY > 0 ? -0.1 : 0.1;
          modalDocState.zoom = Math.max(0.4, Math.min(modalDocState.zoom + zoomDelta, 3.0));
        } else {
          modalDocState.pan.x -= e.deltaX;
          modalDocState.pan.y -= e.deltaY;
        }
        
        const paper = document.getElementById('modal-paper');
        if (paper) {
          paper.style.transform = `translate(${modalDocState.pan.x}px, ${modalDocState.pan.y}px) scale(${modalDocState.zoom})`;
        }
        document.getElementById('zoom-percentage').innerText = `${Math.round(modalDocState.zoom * 100)}%`;
      }, { passive: false });
    }

    function setModalTool(toolName) {
      modalDocState.tool = toolName;
      document.getElementById('btn-tool-hand').className = `p-1.5 rounded-lg transition ${toolName === 'hand' ? 'bg-white shadow-sm text-brand-600' : 'text-slate-500'}`;
      document.getElementById('btn-tool-pencil').className = `p-1.5 rounded-lg transition ${toolName === 'pencil' ? 'bg-white shadow-sm text-red-500' : 'text-slate-500'}`;
      
      const viewport = document.getElementById('modal-viewport');
      viewport.style.cursor = toolName === 'hand' ? 'grab' : 'crosshair';
    }

    function modalZoomIn() {
      modalDocState.zoom = Math.min(modalDocState.zoom + 0.2, 3.0);
      const paper = document.getElementById('modal-paper');
      if (paper) paper.style.transform = `translate(${modalDocState.pan.x}px, ${modalDocState.pan.y}px) scale(${modalDocState.zoom})`;
      document.getElementById('zoom-percentage').innerText = `${Math.round(modalDocState.zoom * 100)}%`;
    }

    function modalZoomOut() {
      modalDocState.zoom = Math.max(0.4, modalDocState.zoom - 0.2);
      const paper = document.getElementById('modal-paper');
      if (paper) paper.style.transform = `translate(${modalDocState.pan.x}px, ${modalDocState.pan.y}px) scale(${modalDocState.zoom})`;
      document.getElementById('zoom-percentage').innerText = `${Math.round(modalDocState.zoom * 100)}%`;
    }

    function clearModalDrawings() {
      if (modalDocState.activeFile) {
        modalDocState.drawingLines[modalDocState.activeFile.id] = [];
        redrawModalDrawings();
      }
    }

    function drawSvgTempLine() {
      const svg = document.getElementById('modal-svg');
      if (!svg || !modalDocState.currentLine) return;

      redrawModalDrawings(); // Render ulang data garis lama

      // Gambar garis aktif (temporary)
      const points = modalDocState.currentLine.map(p => `${p.x},${p.y}`).join(' ');
      const poly = `<polyline points="${points}" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />`;
      svg.innerHTML += poly;
    }

    function redrawModalDrawings() {
      const svg = document.getElementById('modal-svg');
      if (!svg || !modalDocState.activeFile) return;

      const fId = modalDocState.activeFile.id;
      const fileLines = modalDocState.drawingLines[fId] || [];

      let linesHtml = fileLines.map(line => {
        const points = line.map(p => `${p.x},${p.y}`).join(' ');
        return `<polyline points="${points}" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />`;
      }).join('');

      svg.innerHTML = linesHtml;
    }

    // Menyimpan Pembaruan Evaluasi/Lampiran Baru (Fetch ke Backend)
    async function saveModalRecordChanges() {
      const record = modalDocState.record;
      record.updated_at = new Date();

      try {
        // Post ke backend (menyelesaikan Solusi 3 try-catch alur)
        const res = await fetch(`${API_BASE}/records`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(record)
        });
        const data = await res.json();

        if (data.success) {
          // Update ke state local (menyelesaikan Solusi 2 state update)
          const exists = state.records.some(r => r.id === record.id);
          if (exists) {
            state.records = state.records.map(r => r.id === record.id ? record : r);
          } else {
            state.records.push(record);
          }

          showToast('Data berkas berhasil disimpan di server!', 'success');
          closeDocumentModal();
          renderApp(); // Re-render halaman agar tabel diperbarui
        } else {
          showToast('Backend gagal menyimpan data.', 'warning');
        }
      } catch (err) {
        console.error(err);
        // Fallback simpan lokal jika server offline
        const exists = state.records.some(r => r.id === record.id);
        if (exists) {
          state.records = state.records.map(r => r.id === record.id ? record : r);
        } else {
          state.records.push(record);
        }
        showToast('Tersimpan di local storage (offline mode).', 'info');
        closeDocumentModal();
        renderApp();
      }
    }

            <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Program Audit Baru</label>
            <input type="text" id="new-audit-name" placeholder="Contoh: Audit BPK 2027" class="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-brand-500" />
          </div>
          <div class="pt-4 flex justify-end gap-2 border-t border-slate-100">
            <button onclick="closeSimpleModal()" class="px-4 py-2 text-xs font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 rounded-lg transition">Batal</button>
            <button onclick="executeAddAudit()" class="px-4 py-2 text-xs font-bold text-white bg-brand-500 hover:bg-brand-600 rounded-lg transition">Tambah Program</button>
          </div>
        </div>
      `;
      openSimpleModal('Daftarkan Program Audit Baru', bodyHtml);
    }

    async function executeAddAudit() {
      const name = document.getElementById('new-audit-name').value;
      if (!name) return;

      // Cari ID maksimal yang ada agar tidak bentrok (Solusi 7 Rencana)
      const maxId = state.audits.reduce((max, a) => {
        const num = parseInt(a.id.replace('A', ''), 10);
        return isNaN(num) ? max : Math.max(max, num);
      }, 0);
      const newAuditId = `A${maxId + 1}`;

      try {
        const res = await fetch(`${API_BASE}/audits`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: newAuditId, name })
        });
        const data = await res.json();
        
        if (data.success) {
          const newAudit = { id: newAuditId, name };
          state.audits.push(newAudit);
          showToast(`Program audit "${name}" berhasil didaftarkan!`, 'success');
          closeSimpleModal();
          renderApp();
        }
      } catch (err) {
        console.error(err);
        showToast('Koneksi server database terganggu.', 'warning');
      }
    }

    // Modal: Edit Dokumen
    function openEditDocModal(docId) {
      const doc = state.docs.find(d => d.id === docId);
      if (!doc) return;

      const bodyHtml = `
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Dokumen Kebutuhan</label>
            <input type="text" id="edit-doc-name" value="${doc.name}" class="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-brand-500" />
          </div>
          <div class="pt-4 flex justify-end gap-2 border-t border-slate-100">
            <button onclick="closeSimpleModal()" class="px-4 py-2 text-xs font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 rounded-lg transition">Batal</button>
            <button onclick="saveEditDoc('${docId}')" class="px-4 py-2 text-xs font-bold text-white bg-brand-500 hover:bg-brand-600 rounded-lg transition shadow-md shadow-brand-500/10">Simpan Perubahan</button>
          </div>
        </div>
      `;
      openSimpleModal('Edit Nama Dokumen Master', bodyHtml);
    }

    async function saveEditDoc(docId) {
      const name = document.getElementById('edit-doc-name').value;
      if (!name) return;

      try {
        const res = await fetch(`${API_BASE}/documents/${docId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (data.success) {
          state.docs = state.docs.map(d => d.id === docId ? { ...d, name } : d);
          showToast('Nama dokumen berhasil diperbarui!', 'success');
          closeSimpleModal();
          renderTabContent();
        }
      } catch (err) {
        console.error(err);
        showToast('Koneksi bermasalah. Gagal menyimpan.', 'warning');
      }
    }

    // Modal: Hapus Dokumen
    function openDeleteDocModal(docId) {
      const doc = state.docs.find(d => d.id === docId);
      if (!doc) return;

      const bodyHtml = `
        <div class="space-y-4">
          <p class="text-sm text-slate-600 font-semibold leading-relaxed">Apakah Anda yakin ingin menghapus format master dokumen <strong>"${doc.name}"</strong> secara permanen?</p>
          <p class="text-xs text-red-500 font-semibold leading-relaxed"><i data-lucide="alert-triangle" class="w-3.5 h-3.5 inline mr-1"></i> Format dokumen ini akan dihapus dari seluruh cabang beserta file lampiran yang sudah diunggah oleh auditee.</p>
          <div class="pt-4 flex justify-end gap-2 border-t border-slate-100">
            <button onclick="closeSimpleModal()" class="px-4 py-2 text-xs font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 rounded-lg transition">Batal</button>
            <button onclick="executeDeleteDoc('${docId}')" class="px-4 py-2 text-xs font-bold text-white bg-red-600 hover:bg-red-700 rounded-lg transition">Ya, Hapus Dokumen</button>
          </div>
        </div>
      `;
      openSimpleModal('Konfirmasi Hapus Dokumen', bodyHtml);
    }

    async function executeDeleteDoc(docId) {
      try {
        const res = await fetch(`${API_BASE}/documents/${docId}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
          state.docs = state.docs.filter(d => d.id !== docId);
          state.records = state.records.filter(r => r.document_id !== docId);
          showToast('Dokumen master berhasil dihapus dari sistem.', 'success');
          closeSimpleModal();
          renderTabContent();
        }
      } catch (err) {
        console.error(err);
        showToast('Error terhubung ke database.', 'warning');
      }
    }

    // Modal: Tambah Kebutuhan Dokumen (Solusi 7 ID Maksimum Rencana)
    function openAddDocModal() {
      const bodyHtml = `
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Kebutuhan Dokumen Baru</label>
            <input type="text" id="new-doc-name" placeholder="Contoh: Sertifikat K3 Lingkungan Kerja" class="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-brand-500" />
          </div>
          <div class="pt-4 flex justify-end gap-2 border-t border-slate-100">
            <button onclick="closeSimpleModal()" class="px-4 py-2 text-xs font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 rounded-lg transition">Batal</button>
            <button onclick="executeAddDoc()" class="px-4 py-2 text-xs font-bold text-white bg-brand-500 hover:bg-brand-600 rounded-lg transition">Tambah Dokumen</button>
          </div>
        </div>
      `;
      openSimpleModal('Daftarkan Format Dokumen Master', bodyHtml);
    }

    async function executeAddDoc() {
      const name = document.getElementById('new-doc-name').value;
      if (!name) return;

      // Cari ID maksimal yang ada agar tidak bentrok (Solusi 7 Rencana)
      const maxId = state.docs.reduce((max, d) => {
        const num = parseInt(d.id.replace('D', ''), 10);
        return isNaN(num) ? max : Math.max(max, num);
      }, 0);
      const newDocId = `D${String(maxId + 1).padStart(2, '0')}`;

      try {
        const res = await fetch(`${API_BASE}/documents`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: newDocId, name })
        });
        const data = await res.json();
        
        if (data.success) {
          const newDoc = { id: newDocId, name };
          state.docs.push(newDoc);
          showToast(`Dokumen "${name}" berhasil didaftarkan!`, 'success');
          closeSimpleModal();
          renderTabContent();
        }
      } catch (err) {
        console.error(err);
        showToast('Koneksi server database terganggu.', 'warning');
      }
    }

    // Fungsi Duplikasi Dokumen (Solusi 5 Rencana)
    async function triggerCopyDoc(docId) {
      const doc = state.docs.find(d => d.id === docId);
      if (!doc) return;

      const newName = `${doc.name} (Copy)`;
      const maxId = state.docs.reduce((max, d) => {
        const num = parseInt(d.id.replace('D', ''), 10);
        return isNaN(num) ? max : Math.max(max, num);
      }, 0);
      const newDocId = `D${String(maxId + 1).padStart(2, '0')}`;

      try {
        const res = await fetch(`${API_BASE}/documents`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: newDocId, name: newName })
        });
        const data = await res.json();
        
        if (data.success) {
          const newDoc = { id: newDocId, name: newName };
          state.docs.push(newDoc);
          showToast(`Dokumen "${newName}" berhasil diduplikat!`, 'success');
          renderTabContent();
        }
      } catch (err) {
        console.error(err);
        showToast('Koneksi server terganggu.', 'warning');
      }
    }

    // Modal: Tambah User
    function openAddUserModal() {
      let locOptionsHtml = state.locations.map(loc => `<option value="${loc.name}">${loc.name}</option>`).join('');

      const bodyHtml = `
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Lengkap Pengguna</label>
            <input type="text" id="new-user-name" placeholder="Contoh: Budi Santoso" class="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-brand-500" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1">Username Login</label>
              <input type="text" id="new-user-username" placeholder="Contoh: budi123" class="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-brand-500" />
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
              <input type="password" id="new-user-password" placeholder="••••••" class="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-brand-500" />
            </div>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Peran (Role) Sistem</label>
            <select id="new-user-role" onchange="toggleUserLocationSelect(this.value)" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500 font-semibold text-slate-700">
              <option value="auditee">Auditee Entitas / Cabang (Unggah Saja)</option>
              <option value="auditor">Auditor Pusat (Admin Full Access)</option>
            </select>
          </div>
          <div id="user-location-block">
            <label class="block text-sm font-semibold text-slate-700 mb-1">Akses Entitas / Cabang</label>
            <input type="text" id="new-user-locname" list="modal-loc-options" placeholder="Pilih atau ketik cabang baru..." class="w-full border border-slate-300 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-brand-500 font-semibold text-slate-700" />
            <datalist id="modal-loc-options">
              ${locOptionsHtml}
            </datalist>
            <p class="text-[10px] text-slate-500 mt-1 font-medium">Sistem akan otomatis mendaftarkan profil entitas jika belum terdaftar.</p>
          </div>
          <div id="user-modal-error" class="hidden text-red-600 text-[11px] bg-red-50 p-2.5 rounded-lg border border-red-100 font-bold flex items-center">
            <i data-lucide="alert-triangle" class="w-3.5 h-3.5 mr-2 shrink-0"></i> <span id="user-error-msg"></span>
          </div>
          <div class="pt-4 flex justify-end gap-2 border-t border-slate-100">
            <button onclick="closeSimpleModal()" class="px-4 py-2 text-xs font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 rounded-lg transition">Batal</button>
            <button onclick="executeAddUser()" class="px-4 py-2 text-xs font-bold text-white bg-brand-500 hover:bg-brand-600 rounded-lg transition shadow-md shadow-brand-500/10">Buat Akun</button>
          </div>
        </div>
      `;
      openSimpleModal('Tambah Pengguna Baru', bodyHtml);
    }

    function toggleUserLocationSelect(val) {
      const block = document.getElementById('user-location-block');
      if (val === 'auditor') {
        block.classList.add('hidden');
      } else {
        block.classList.remove('hidden');
      }
    }

    async function executeAddUser() {
      const name = document.getElementById('new-user-name').value;
      const username = document.getElementById('new-user-username').value;
      const password = document.getElementById('new-user-password').value;
      const role = document.getElementById('new-user-role').value;
      const locName = document.getElementById('new-user-locname').value;

      const errorDiv = document.getElementById('user-modal-error');
      const errorMsg = document.getElementById('user-error-msg');

      if (!name || !username || !password) {
        errorMsg.innerText = 'Mohon lengkapi Nama, Username, dan Password!';
        errorDiv.classList.remove('hidden');
        lucide.createIcons();
        return;
      }
      if (role === 'auditee' && !locName) {
        errorMsg.innerText = 'Cabang akses harus diisi untuk akun Auditee!';
        errorDiv.classList.remove('hidden');
        lucide.createIcons();
        return;
      }

      errorDiv.classList.add('hidden');

      try {
        let assignedLocId = null;

        if (role === 'auditee') {
          // Cari apakah cabang sudah ada
          const existingLoc = state.locations.find(l => l.name.toLowerCase() === locName.toLowerCase());
          if (existingLoc) {
            assignedLocId = existingLoc.id;
          } else {
            // Daftarkan cabang baru terlebih dahulu
            const locRes = await fetch(`${API_BASE}/locations`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: locName, pic: name })
            });
            const locData = await locRes.json();
            if (locData.success) {
              assignedLocId = locData.id;
              state.locations.push({ id: assignedLocId, name: locName, pic: name });
            }
          }
        }

        const res = await fetch(`${API_BASE}/users`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, username, password, role, location_id: assignedLocId })
        });
        const data = await res.json();
        
        if (data.success) {
          const newUser = { id: data.id, name, username, password, role, location_id: assignedLocId };
          state.users.push(newUser);
          showToast(`Akun pengguna "${name}" berhasil didaftarkan!`, 'success');
          closeSimpleModal();
          renderTabContent();
        }
      } catch (err) {
        console.error(err);
        showToast('Koneksi API bermasalah. Gagal mendaftarkan user.', 'warning');
      }
    }


    // ================= FITUR BERBAGI LINK AKSES CEPAT (GUEST LINK) =================
    function triggerShareLink(auditId, locId) {
      const baseUrl = window.location.href.split('#')[0];
      const shareUrl = `${baseUrl}#access=${auditId}-${locId}`;

      // Salin ke papan klip secara kompatibel
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          showToast('Tautan akses tamu berhasil disalin!', 'success');
        });
      } else {
        const ta = document.createElement('textarea');
        ta.value = shareUrl;
        ta.style.position = 'fixed';
        ta.style.left = '-999999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy') ? showToast('Tautan akses tamu berhasil disalin!', 'success') : showToast('Gagal menyalin tautan.', 'warning');
        ta.remove();
      }
    }

    // ================= FITUR UNDUH ALL FILES SIMULASI ZIP (DARI SIDEBAR) =================
    function triggerDownloadAllFiles(auditId) {
      const audit = state.audits.find(a => a.id === auditId);
      if (!audit) return;

      const isAuditor = state.currentUser.role === 'auditor';
      let auditRecords = state.records.filter(r => r.audit_id === auditId && r.year === state.selectedYear);

      if (!isAuditor) {
        auditRecords = auditRecords.filter(r => r.location_id === state.currentUser.location_id);
      }

      const files = [];
      auditRecords.forEach(rec => {
        if (rec.files) {
          rec.files.forEach(f => {
            const loc = state.locations.find(l => l.id === rec.location_id);
            const doc = state.docs.find(d => d.id === rec.document_id);
            files.push({
              name: f.name,
              locName: loc?.name || 'Cabang',
              docName: doc?.name || 'Dokumen'
            });
          });
        }
      });

      if (files.length === 0) {
        showToast('Tidak ada berkas unggahan dalam program audit ini.', 'warning');
        return;
      }

      showToast(`Mempersiapkan paket unduhan (${files.length} berkas)...`, 'info');

      // Simulasi pembuatan berkas teks struktur berkas
      setTimeout(() => {
        let content = `========================================================================\n`;
        content += `PAKET UNDUHAN DOKUMEN PRA-AUDIT (SIMULASI ZIP)\n`;
        content += `Program Audit : ${audit.name.toUpperCase()}\n`;
        content += `Tahun Audit   : ${state.selectedYear}\n`;
        content += `Diunduh Oleh  : ${state.currentUser.name} (${isAuditor ? 'Auditor Pusat' : 'Auditee Cabang'})\n`;
        content += `Waktu Unduh   : ${new Date().toLocaleString('id-ID')}\n`;
        content += `========================================================================\n\n`;
        content += `Daftar Berkas Terlampir:\n\n`;

        files.forEach((f, idx) => {
          content += `${idx + 1}. [${f.locName}] — ${f.docName}\n`;
          content += `   Nama File: ${f.name}\n`;
          content += `   ------------------------------------------------------------------\n`;
        });

        content += `\n[Simulasi] Seluruh file fisik asli di atas berhasil diunduh ke komputer Anda.`;

        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const dl = document.createElement('a');
        dl.href = URL.createObjectURL(blob);
        dl.download = `Paket_Unduh_${audit.name.replace(/\s+/g, '_')}_${state.selectedYear}.txt`;
        dl.click();

        showToast(`Paket berkas "${audit.name}" berhasil diunduh!`, 'success');
      }, 1000);
    }


    // MEMULAI APLIKASI
    window.addEventListener('DOMContentLoaded', () => {
      initData();
    });
  </script>
